<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="src/slide.css" />
  <link rel="shortcut icon" href="alienn.ico" type="image/x-icon">
  <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="src/slide.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlienByte</title>
</head>

<body>
  <div id="nav-placeholder"></div>

  <!-- SLIDER ANIMADO -->
  <section class="slider">
    <div class="slider-content">
      <input type="radio" name="btn-radio" id="radio1" />
      <input type="radio" name="btn-radio" id="radio2" />
      <input type="radio" name="btn-radio" id="radio3" />

      <div class="slide-box primeiro">
        <img class="img-desktop" src="./src/images/gabinete.jpg" alt="slide 1" />
        <img class="img-mobile" src="./src/images/gabinete mob.jpg" alt="slide 1" />
      </div>

      <div class="slide-box">
        <img class="img-desktop" src="./imgpromo/hora do play.jpg" alt="slide 3" />
        <img class="img-mobile" src="./imgpromo/hora do play mobile.jpg" alt="slide 1" />
      </div>

      <div class="slide-box">
        <img class="img-desktop" src="src/images/1.jpg" alt="slide 3" />
        <img class="img-mobile" src="src/images/slide 1 mob.jpg" alt="slide 3" />
      </div>

      <button type="button" class="slider-arrow slider-arrow--prev" aria-label="Slide anterior">
        <i class="bx bx-chevron-left" aria-hidden="true"></i>
      </button>
      <button type="button" class="slider-arrow slider-arrow--next" aria-label="Próximo slide">
        <i class="bx bx-chevron-right" aria-hidden="true"></i>
      </button>

      <div class="nav-dots">
        <label for="radio1" class="nav-dots__dot"><span class="sr-only">Slide 1</span></label>
        <label for="radio2" class="nav-dots__dot"><span class="sr-only">Slide 2</span></label>
        <label for="radio3" class="nav-dots__dot"><span class="sr-only">Slide 3</span></label>
      </div>
    </div>
  </section>
  <br>

  <br>
  <h5>Gabinetes<b> Gamer</b></h5>
  <div class="slide" id="product-grid"></div>

  <br>



  <!-- FOOTER -->
    <!-- FOOTER -->

    <div id="footer-placeholder"></div>


  <!-- JAVASCRIPT PARTE NAVBAR -->
  <script src="cart.js"></script>
  <script src="data/products-gabinetes.js"></script>
  <script src="render-products.js"></script>
  <script>renderProductGrid(productsGabinetes, "product-grid");</script>
  <script src="include.js"></script>
  <script src="script.js"></script>
</body>

</html>

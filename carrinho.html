<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="shortcut icon" href="assets/img/alienn.ico" type="image/x-icon">
  <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet" />
  <script src="assets/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Revise os produtos do seu carrinho AlienByte antes de finalizar a compra." />
  <title>Meu Carrinho | AlienByte</title>
</head>

<body>
  <div id="nav-placeholder"></div>

  <main class="cart-page">
    <ol class="checkout-steps">
      <li class="checkout-steps__step is-active">
        <span class="checkout-steps__icon"><i class="bx bx-cart" aria-hidden="true"></i></span>
        <span class="checkout-steps__label">Carrinho</span>
      </li>
      <li class="checkout-steps__step">
        <span class="checkout-steps__icon"><i class="bx bx-user" aria-hidden="true"></i></span>
        <span class="checkout-steps__label">Identificação</span>
      </li>
      <li class="checkout-steps__step">
        <span class="checkout-steps__icon"><i class="bx bx-dollar" aria-hidden="true"></i></span>
        <span class="checkout-steps__label">Pagamento</span>
      </li>
      <li class="checkout-steps__step">
        <span class="checkout-steps__icon"><i class="bx bx-check" aria-hidden="true"></i></span>
        <span class="checkout-steps__label">Confirmação</span>
      </li>
    </ol>

    <h1 class="cart-page__title">Meu Carrinho</h1>
    <div id="cart-page-root" class="cart-page__layout"></div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/include.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>

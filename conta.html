<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="shortcut icon" href="assets/img/alienn.ico" type="image/x-icon">
  <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="assets/js/login.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlienByte</title>
</head>

<body>
  <div id="nav-placeholder"></div>

  <main>
    <div class="login-container" id="login-container">
        <div class="form-container">
            <div class="mobile-tabs">
                <a href="#" id="open-login-mobile" class="mobile-tab">Login</a>
                <a href="#" id="open-register-mobile" class="mobile-tab">Cadastro</a>
            </div>
            <form class="form form-login">
                <h2 class="form-title">LOGIN<p><small>sou cliente</small></p></h2>
                <div class="form-social">
                    <a href="https://www.facebook.com/?locale=pt_BR" class="social-icon">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="https://accounts.google.com/AccountChooser/signinchooser?service=mail&continue=https%3A%2F%2Fmail.google.com%2Fmail%2F&flowName=GlifWebSignIn&flowEntry=AccountChooser&theme=glif" class="social-icon">
                        <i class="fab fa-google"></i>
                    </a>
                </div>
                <p class="form-text">ou utilize sua conta</p>
                <div class="form-input-container">
                    <input type="email" class="form-input" placeholder="Email">
                    <input type="password" class="form-input" placeholder="Senha">
                </div>
                <a href="esquece.html" class="form-link">Esqueceu a senha?</a>
                <button type="button" class="form-button">ENTRAR</button>
            </form>
            <form class="form form-register">
                <h2 class="form-title">Criar Conta</h2>
                <div class="form-social">
                  <a href="https://www.facebook.com/?locale=pt_BR" class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://accounts.google.com/AccountChooser/signinchooser?service=mail&continue=https%3A%2F%2Fmail.google.com%2Fmail%2F&flowName=GlifWebSignIn&flowEntry=AccountChooser&theme=glif" class="social-icon">
                    <i class="fab fa-google"></i>
                </a>
                </div>
                <p class="form-text">ou cadastre seu email</p>
                <div class="form-input-container">
                    <input type="text" class="form-input" placeholder="Nome">
                    <input type="email" class="form-input" placeholder="Email">
                    <input type="password" class="form-input" placeholder="Senha">
                </div>
                <button type="button" class="form-button">Cadastrar</button>
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <h2 class="form-title form-title-light">Já tem conta?</h2>
                <p class="form-text">Olá! Se você já comprou na AlienByte antes, por favor, informe seu e-mail e senha.</p>
                <button class="form-button form-button-light" id="open-login">Entrar</button>
            </div>
            <div class="overlay">
                <h2 class="form-title form-title-light">Olá Cliente!</h2>
                <p class="form-text">Cadastre-se e venha se tornar um Alien</p>
                <button class="form-button form-button-light" id="open-register">Cadastrar</button>
            </div>
        </div>
    </div>
</main>

<div id="footer-placeholder"></div>

<!-- JAVASCRIPT PARTE NAVBAR -->
<script src="assets/js/include.js"></script>
<script src="assets/js/script.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
</body>

</html>

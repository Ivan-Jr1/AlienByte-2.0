<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/slide.css" />
  <link rel="shortcut icon" href="assets/img/alienn.ico" type="image/x-icon">
  <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet" />
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/slide.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Headsets gamer com som surround, RGB e modelos sem fio da Logitech, Redragon e HyperX na AlienByte." />
  <title>Headset Gamer | AlienByte</title>
</head>

<body>
  <div id="nav-placeholder"></div>

  <!-- SLIDER ANIMADO -->
  <section class="slider">
    <div class="slider-content">
      <input type="radio" name="btn-radio" id="radio1" />
      <input type="radio" name="btn-radio" id="radio2" />
      <input type="radio" name="btn-radio" id="radio3" />

      <div class="slide-box primeiro">
        <img class="img-desktop" src="assets/img/slide/head7.jpg" alt="Headset Logitech G435 Wireless" />
        <img class="img-mobile" src="assets/img/slide/h7 mob.jpg" alt="Headset Logitech G435 Wireless" />
      </div>

      <div class="slide-box">
        <img class="img-desktop" src="assets/img/slide/2.jpg" alt="Desbrave o universo gamer: consoles PlayStation 5 e Nintendo Switch" loading="lazy" />
        <img class="img-mobile" src="assets/img/slide/2 mobile.jpg" alt="Desbrave o universo gamer: consoles PlayStation 5 e Nintendo Switch" loading="lazy" />
      </div>

      <div class="slide-box">
        <img class="img-desktop" src="assets/img/slide/m800pro.jpg" alt="Mouse gamer Delux M800 Pro: o modelo que se encaixa no seu estilo" loading="lazy" />
        <img class="img-mobile" src="assets/img/slide/m800pro mob.jpg" alt="Mouse gamer Delux M800 Pro: o modelo que se encaixa no seu estilo" loading="lazy" />
      </div>

      <button type="button" class="slider-arrow slider-arrow--prev" aria-label="Slide anterior">
        <i class="bx bx-chevron-left" aria-hidden="true"></i>
      </button>
      <button type="button" class="slider-arrow slider-arrow--next" aria-label="Próximo slide">
        <i class="bx bx-chevron-right" aria-hidden="true"></i>
      </button>

      <div class="nav-dots">
        <label for="radio1" class="nav-dots__dot"><span class="sr-only">Slide 1</span></label>
        <label for="radio2" class="nav-dots__dot"><span class="sr-only">Slide 2</span></label>
        <label for="radio3" class="nav-dots__dot"><span class="sr-only">Slide 3</span></label>
      </div>
    </div>
  </section>
  <br>

  <br>
  <br>
  <h5>Headset<b> Gamer</b></h5>
  <div class="slide" id="product-grid"></div>

  <br>



  <!-- FOOTER -->
  <!-- FOOTER -->

  <div id="footer-placeholder"></div> 


  <!-- JAVASCRIPT PARTE NAVBAR -->
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="data/products-headset.js"></script>
  <script src="assets/js/render-products.js"></script>
  <script>renderProductGrid(productsHeadset, "product-grid");</script>
  <script src="assets/js/include.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>

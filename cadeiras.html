<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/slide.css" />
    <link rel="shortcut icon" href="assets/img/alienn.ico" type="image/x-icon">
    <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet" />
  <script src="assets/js/theme.js"></script>
      <script src="assets/js/slide.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cadeiras gamer e de escritório ergonômicas, como a linha ThunderX3, com frete grátis na AlienByte." />
    <title>Cadeiras Gamer e de Escritório | AlienByte</title>
</head>

<body>
    <div id="nav-placeholder"></div>

    <!-- SLIDER ANIMADO -->
    <section class="slider">
    <div class="slider-content">
      <input type="radio" name="btn-radio" id="radio1" />
      <input type="radio" name="btn-radio" id="radio2" />
      <input type="radio" name="btn-radio" id="radio3" />

      <div class="slide-box primeiro">
        <img class="img-desktop" src="assets/img/slide/cadeiras 3.jpg" alt="Cadeiras gamer ThunderX3" />
        <img class="img-mobile" src="assets/img/slide/3 cadeira mobile.jpg" alt="Cadeiras gamer ThunderX3" />
      </div>

      <div class="slide-box">
        <img class="img-desktop" src="assets/img/promo/imgpromo/hora do play.jpg" alt="Hora do Play: notebook gamer, iPhone, headset HyperX, Xbox Series X e PlayStation 5" loading="lazy" />
        <img class="img-mobile" src="assets/img/promo/imgpromo/hora do play mobile.jpg" alt="Hora do Play: notebook gamer, iPhone, headset HyperX, Xbox Series X e PlayStation 5" loading="lazy" />
      </div>

      <div class="slide-box">
        <img class="img-desktop" src="assets/img/slide/1.jpg" alt="AlienByte" loading="lazy" />
        <img class="img-mobile" src="assets/img/slide/slide 1 mob.jpg" alt="AlienByte" loading="lazy" />
      </div>

      <button type="button" class="slider-arrow slider-arrow--prev" aria-label="Slide anterior">
        <i class="bx bx-chevron-left" aria-hidden="true"></i>
      </button>
      <button type="button" class="slider-arrow slider-arrow--next" aria-label="Próximo slide">
        <i class="bx bx-chevron-right" aria-hidden="true"></i>
      </button>

      <div class="nav-dots">
        <label for="radio1" class="nav-dots__dot"><span class="sr-only">Slide 1</span></label>
        <label for="radio2" class="nav-dots__dot"><span class="sr-only">Slide 2</span></label>
        <label for="radio3" class="nav-dots__dot"><span class="sr-only">Slide 3</span></label>
      </div>
    </div>
  </section>
    <br>

    <br>
    <h5>Cadeiras<b> em Geral</b></h5>
    <div class="slide" id="product-grid"></div>

    <br>



    <!-- FOOTER -->
  <!-- FOOTER -->

  <div id="footer-placeholder"></div>


    <!-- JAVASCRIPT PARTE NAVBAR -->

  <script src="assets/js/wishlist.js"></script>
  <script src="data/products-cadeiras.js"></script>
  <script src="assets/js/render-products.js"></script>
  <script>renderProductGrid(productsCadeiras, "product-grid");</script>
  <script src="assets/js/include.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
